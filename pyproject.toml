[project]
name = "vklass-mcp"
version = "0.4.0"
description = "Self-hosted MCP server for Vklass guardian data and absence reporting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Per Appelgren" }]
dependencies = [
  "aiohttp>=3.13,<4",
  "aiosqlite>=0.22,<1",
  "beautifulsoup4>=4.14,<5",
  "cryptography>=46,<47",
  "mcp[cli]>=1.29,<2",
  "pydantic-settings>=2.12,<3",
  "python-dateutil>=2.9,<3",
  "qrcode[pil]>=8.2,<9",
  "uvicorn>=0.40,<1",
]

[project.scripts]
vklass-mcp = "vklass_mcp.__main__:main"
vklass-mcp-healthcheck = "vklass_mcp.healthcheck:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-python-dateutil>=2.9,<3",
  "types-qrcode>=8.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vklass_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/vklass_mcp/auth_ui.py" = ["E501"]
"tests/*" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vklass_mcp"]

[[tool.mypy.overrides]]
module = ["vklass_mcp.app", "vklass_mcp.auth_ui"]
disable_error_code = ["untyped-decorator"]
